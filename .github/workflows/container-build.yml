name: Build Containers

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install lint tools
        run: pip install -r tests/requirements-dev.txt

      - name: ruff
        run: ruff check service/ tests/ hub/

      - name: mypy
        run: mypy --ignore-missing-imports service/

  build-hub:
    name: Build hub image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract hub metadata
        id: hub-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/desktop-stream-hub
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, cache, and export hub image
        uses: docker/build-push-action@v6
        with:
          context: hub/
          file: hub/Containerfile
          tags: ${{ steps.hub-meta.outputs.tags }}
          labels: ${{ steps.hub-meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=docker,dest=/tmp/desktop-stream-hub.tar
          cache-from: type=gha,scope=hub-buildcache
          cache-to: type=gha,scope=hub-buildcache,mode=max

      - name: Upload hub image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-image
          path: /tmp/desktop-stream-hub.tar
          retention-days: 1

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: desktop-stream-service
            context: ./service
            cache_scope: service-buildcache
            artifact: service-image
            tarball: /tmp/desktop-stream-service.tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, cache, and export image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=docker,dest=${{ matrix.tarball }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.tarball }}
          retention-days: 1

  # Pure-Python unit tests — no containers, no browser, no TURN relay.
  # All container/browser integration coverage lives in the Java
  # functional-test job below.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  functional-test:
    name: Java functional tests
    runs-on: ubuntu-latest
    needs: [build, build-hub]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            ffmpeg \
            google-chrome-stable \
            x11-apps \
            coturn

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download service image
        uses: actions/download-artifact@v4
        with:
          name: service-image
          path: /tmp/artifacts/service

      - name: Download hub image
        uses: actions/download-artifact@v4
        with:
          name: hub-image
          path: /tmp/artifacts/hub

      - name: Load images into Docker
        run: |
          SERVICE_LOADED=$(docker load -i /tmp/artifacts/service/desktop-stream-service.tar \
                           | grep "Loaded image:" | head -1 | awk '{print $NF}')
          docker tag "${SERVICE_LOADED}" desktop-stream-service:ci

          HUB_LOADED=$(docker load -i /tmp/artifacts/hub/desktop-stream-hub.tar \
                       | grep "Loaded image:" | head -1 | awk '{print $NF}')
          docker tag "${HUB_LOADED}" desktop-stream-hub:ci

          docker images | grep -E '^(desktop-stream-service|desktop-stream-hub)\s+ci\s'

      - name: Start local TURN relay
        run: |
          turnserver \
            --listening-port=3478 \
            --listening-ip=127.0.0.1 \
            --relay-ip=127.0.0.1 \
            --lt-cred-mech \
            --user=ci:ci \
            --realm=test.local \
            --no-tls \
            --no-dtls \
            --allow-loopback-peers \
            --no-cli \
            --verbose \
            --log-file=/tmp/turnserver-ft.log &
          for i in $(seq 1 20); do
            if ss -ulnp 2>/dev/null | grep -q ':3478 '; then
              echo "TURN server ready on UDP 3478"; break
            fi
            sleep 0.5
          done

      - name: Run functional tests
        working-directory: functional-tests
        env:
          SERVICE_IMAGE:          "desktop-stream-service:ci"
          HUB_IMAGE:              "desktop-stream-hub:ci"
          GST_WEBRTC_TURN_SERVER: "turn://ci:ci@127.0.0.1:3478"
        run: ./gradlew test

      - name: Generate Allure report
        if: always()
        working-directory: functional-tests
        run: ./gradlew allureReport

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: functional-tests/build/reports/tests/test/
          retention-days: 7

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-allure-report
          path: functional-tests/build/reports/allure-report/
          retention-days: 7

      - name: Show TURN server log
        if: always()
        run: |
          echo "=== coturn log (functional-test) ==="
          cat /tmp/turnserver-ft.log 2>/dev/null || echo "(no log file)"
