name: Build Containers

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install lint tools
        run: pip install -r tests/requirements-dev.txt

      - name: ruff
        run: ruff check service/ tests/ hub/

      - name: mypy
        run: mypy --ignore-missing-imports service/

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: desktop-stream-service
            context: ./service
            cache_scope: service-buildcache
            artifact: service-image
            tarball: /tmp/desktop-stream-service.tar
          - image: desktop-stream-hub
            context: ./hub
            cache_scope: hub-buildcache
            artifact: hub-image
            tarball: /tmp/desktop-stream-hub.tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Extract base-image metadata
        id: base_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ matrix.image }}-base
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Online setup phase: everything third-party (Containerfile.base),
      # loaded into the local daemon so the offline app build below can
      # FROM it without a registry.
      - name: Build base image (online phase)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile.base
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-base
          cache-to: type=gha,scope=${{ matrix.cache_scope }}-base,mode=max

      # Offline app phase: COPYs the in-repo application onto the base.
      # --network=none proves no step needs the network.
      - name: Build app image (offline phase)
        env:
          APP_TAGS: ${{ steps.meta.outputs.tags }}
          APP_LABELS: ${{ steps.meta.outputs.labels }}
          BASE_TAGS: ${{ steps.base_meta.outputs.tags }}
        run: |
          base_tag=$(printf '%s\n' "$BASE_TAGS" | head -n1)
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$APP_TAGS"
          while IFS= read -r label; do
            [ -n "$label" ] && args+=(--label "$label")
          done <<< "$APP_LABELS"
          docker build \
            --network=none \
            --pull=false \
            --build-arg "BASE_IMAGE=${base_tag}" \
            -f ${{ matrix.context }}/Containerfile \
            "${args[@]}" \
            ${{ matrix.context }}

      - name: Export app image tarball
        env:
          APP_TAGS: ${{ steps.meta.outputs.tags }}
        run: docker save -o ${{ matrix.tarball }} "$(printf '%s\n' "$APP_TAGS" | head -n1)"

      - name: Push images
        if: github.event_name != 'pull_request'
        env:
          APP_TAGS: ${{ steps.meta.outputs.tags }}
          BASE_TAGS: ${{ steps.base_meta.outputs.tags }}
        run: |
          printf '%s\n%s\n' "$BASE_TAGS" "$APP_TAGS" \
            | while IFS= read -r tag; do
                [ -n "$tag" ] && docker push "$tag"
              done

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.tarball }}
          retention-days: 1

  # Pure-Python unit tests — no containers, no browser, no TURN relay.
  # All container/browser integration coverage lives in the Java
  # functional-test job below.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  functional-test:
    name: Java functional tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            ffmpeg \
            google-chrome-stable \
            x11-apps \
            coturn

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download service image
        uses: actions/download-artifact@v4
        with:
          name: service-image
          path: /tmp/artifacts/service

      - name: Download hub image
        uses: actions/download-artifact@v4
        with:
          name: hub-image
          path: /tmp/artifacts/hub

      - name: Load images into Docker
        run: |
          SERVICE_LOADED=$(docker load -i /tmp/artifacts/service/desktop-stream-service.tar \
                           | grep "Loaded image:" | head -1 | awk '{print $NF}')
          docker tag "${SERVICE_LOADED}" desktop-stream-service:ci

          HUB_LOADED=$(docker load -i /tmp/artifacts/hub/desktop-stream-hub.tar \
                       | grep "Loaded image:" | head -1 | awk '{print $NF}')
          docker tag "${HUB_LOADED}" desktop-stream-hub:ci

          docker images | grep -E '^(desktop-stream-service|desktop-stream-hub)\s+ci\s'

      - name: Start local TURN relay
        run: |
          turnserver \
            --listening-port=3478 \
            --listening-ip=127.0.0.1 \
            --relay-ip=127.0.0.1 \
            --lt-cred-mech \
            --user=ci:ci \
            --realm=test.local \
            --no-tls \
            --no-dtls \
            --allow-loopback-peers \
            --no-cli \
            --verbose \
            --log-file=/tmp/turnserver-ft.log &
          for i in $(seq 1 20); do
            if ss -ulnp 2>/dev/null | grep -q ':3478 '; then
              echo "TURN server ready on UDP 3478"; break
            fi
            sleep 0.5
          done

      # Online setup phase: wrapper distribution + every dependency into the
      # Gradle cache, so the test run below can prove the offline path works.
      - name: Warm Gradle dependency cache (online phase)
        working-directory: functional-tests
        run: ./gradlew resolveDependencies

      - name: Run functional tests (offline phase)
        working-directory: functional-tests
        env:
          SERVICE_IMAGE:      "desktop-stream-service:ci"
          HUB_IMAGE:          "desktop-stream-hub:ci"
          WEBRTC_TURN_SERVER: "turn://ci:ci@127.0.0.1:3478"
        run: ./gradlew --offline test

      - name: Generate Allure report
        if: always()
        working-directory: functional-tests
        run: ./gradlew allureReport

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: functional-tests/build/reports/tests/test/
          retention-days: 7

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-allure-report
          path: functional-tests/build/reports/allure-report/
          retention-days: 7

      - name: Show TURN server log
        if: always()
        run: |
          echo "=== coturn log (functional-test) ==="
          cat /tmp/turnserver-ft.log 2>/dev/null || echo "(no log file)"
