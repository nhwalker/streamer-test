# Lint-only configuration — two deliberate tooling decisions live here
# (both revisited and reaffirmed after the ffmpeg/MediaMTX rewrite):
#
# * The ruff *formatter* is not used: the codebase hand-aligns
#   assignment/dict tables in several modules and reformatting would
#   destroy intentional readability.
# * mypy runs in its default (non-strict) mode, which passes clean.
#   Strict mode was evaluated and declined: ~120 annotation sites across
#   a small, stable, stdlib-only codebase buys little safety here.
#
# Run `make lint` (ruff check + mypy) locally; CI enforces the same.
target-version = "py311"

[lint]
# Default rule set (E4/E7/E9 pycodestyle errors + pyflakes F) — correctness
# focused, no style churn.
select = ["E4", "E7", "E9", "F"]
