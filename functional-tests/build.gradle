plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'com.streamertest'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    junitVersion          = '5.11.4'
    testcontainersVersion = '1.20.4'
    allureVersion         = '2.29.0'
    seleniumVersion       = '4.27.0'
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'

    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:selenium:${testcontainersVersion}"

    testImplementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"

    // /config.json and streams.json structural assertions
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation "io.qameta.allure:allure-junit5:${allureVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureVersion}"
}

allure {
    version = allureVersion
    adapter {
        aspectjWeaver = true
        autoconfigure = true
    }
}

// ── Offline support ──────────────────────────────────────────────────────────
// The online setup phase (`make setup` → `./gradlew resolveDependencies`)
// downloads the wrapper distribution and every dependency any configuration
// can ever ask for — including the Allure commandline bundle — into the
// Gradle cache; afterwards the suite runs without network via
// `./gradlew --offline test` (`make functional OFFLINE=1`).
tasks.register('resolveDependencies') {
    group = 'build setup'
    description = 'Resolves every dependency into the Gradle cache for later --offline runs.'
    doLast {
        [buildscript.configurations, configurations].each { container ->
            container.findAll { it.canBeResolved }.each { cfg ->
                try {
                    logger.lifecycle("Resolving ${cfg.name} (${cfg.resolve().size()} files)")
                } catch (Exception e) {
                    logger.warn("Could not resolve ${cfg.name}: ${e.message}")
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // Keep all test classes in one JVM so the ServiceStack singleton is shared.
    forkEvery = 0
    maxParallelForks = 1
    // Allow the image name and TURN server to be overridden via environment variables.
    systemProperty 'SERVICE_IMAGE',          System.getenv('SERVICE_IMAGE')          ?: 'desktop-stream-service:ci'
    systemProperty 'HUB_IMAGE',              System.getenv('HUB_IMAGE')              ?: 'desktop-stream-hub:ci'
    systemProperty 'WEBRTC_TURN_SERVER', System.getenv('WEBRTC_TURN_SERVER') ?: ''
}
