// IMPORTANT: Firefox skips the FIRST LINE of this file. Do not move this comment.
// System-wide defaults for HW-accelerated H264 WebRTC over NVDEC (via VAAPI).

// ── GPU backend: force EGL + dmabuf ──────────────────────────────────────────
// nvidia-vaapi-driver only exports decoded frames as EGL+DMA-BUF images, so
// Firefox MUST be on the EGL path (not GLX). On X11 this needs both prefs.
defaultPref("gfx.x11-egl.force-enabled", true);
defaultPref("widget.dmabuf.force-enabled", true);
defaultPref("gfx.webrender.all", true);

// ── Hardware video decode (incoming WebRTC + <video>) ────────────────────────
defaultPref("media.ffmpeg.vaapi.enabled", true);
defaultPref("media.ffvpx.enabled", true);
defaultPref("media.rdd-ffmpeg.enabled", true);
defaultPref("media.rdd-ffvpx.enabled", true);
defaultPref("media.rdd-vpx.enabled", true);
defaultPref("media.hardware-video-decoding.enabled", true);
defaultPref("media.hardware-video-decoding.force-enabled", true);
defaultPref("media.gpu-process-decoder", true);
defaultPref("media.navigator.mediadatadecoder_vpx_enabled", true);
defaultPref("media.navigator.mediadatadecoder_h264_enabled", true);

// ── WebRTC H264 ──────────────────────────────────────────────────────────────
// hw.h264.enabled routes incoming H264 RTP through the MediaDataDecoder
// path (which is what picks up VAAPI). peerconnection.video.h264_enabled
// makes the SDP advertise H264 in offers/answers.
defaultPref("media.webrtc.hw.h264.enabled", true);
defaultPref("media.peerconnection.video.h264_enabled", true);
defaultPref("media.peerconnection.video.vp9_enabled", true);

// HW H264 ENCODE via VAAPI (Firefox 120+; no-op on older ESRs, harmless).
defaultPref("media.webrtc.platformencoder", true);
defaultPref("media.webrtc.platformencoder.vaapi.enabled", true);

// ── OpenH264 GMP (Cisco) — software fallback for WebRTC H264 encode ──────────
// Auto-downloaded on first launch from Cisco's CDN; requires network. Disable
// autoupdate so the container is reproducible.
defaultPref("media.gmp-gmpopenh264.enabled", true);
defaultPref("media.gmp-gmpopenh264.autoupdate", false);
defaultPref("media.gmp-manager.updateEnabled", true);

// ── Don't trip over a missing real audio device ──────────────────────────────
defaultPref("media.cubeb.backend", "pulse");

// ── Quality-of-life: skip the "what's new" tab, default-browser nag, etc. ────
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("startup.homepage_welcome_url", "");
defaultPref("startup.homepage_welcome_url.additional", "");
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("datareporting.policy.firstRunURL", "");
defaultPref("toolkit.telemetry.reportingpolicy.firstRun", false);

// ── Allow getUserMedia without a per-origin prompt (test/automation only) ────
// Comment these out if you don't want every page to silently grab cam/mic.
defaultPref("permissions.default.camera", 1);
defaultPref("permissions.default.microphone", 1);
defaultPref("media.navigator.permission.disabled", false);
