<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Stream</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }

    #header {
      flex: 0 0 auto;
      padding: 0 1em;
      line-height: 2.2;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    #m-health {
      display: inline-block;
      width: 0.7em;
      height: 0.7em;
      border-radius: 50%;
      margin-right: 0.4em;
      background: #555;
      vertical-align: middle;
      transition: background-color 0.3s;
    }
    #m-health.green  { background: #4caf50; }
    #m-health.yellow { background: #ffc107; }
    #m-health.red    { background: #f44336; }

    #video-area {
      flex: 1 1 0;
      min-height: 0;
      position: relative;
      background: #000;
    }

    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 0.75em 1.25em;
      background: rgba(255,255,255,0.07);
      border-radius: 6px;
      max-width: 480px;
      text-align: center;
      line-height: 1.5;
      white-space: nowrap;
      z-index: 1;
    }

    #status.error { color: #f88; background: rgba(255,80,80,0.12); }
    #status.hidden { display: none; }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="m-health" title="Stream health. Green: healthy. Yellow: high QP or 1–5% loss. Red: freezes, &gt;5% loss, or keyframe requests."></span>
    Desktop: <span id="m-name">--</span>
    &nbsp;&nbsp;FPS: <span id="m-fps">--</span>
    &nbsp;&nbsp;RTT/2 (ms): <span id="m-lat" title="Half of the WebRTC round-trip time. Network only — does not include encode, jitter buffer, decode or render delay.">--</span>
    &nbsp;&nbsp;Res: <span id="m-res">--</span>
    &nbsp;&nbsp;QP: <span id="m-qp" title="Average quantization parameter over the rolling 10s window. Higher = more compression. Codec-dependent scale (H.264: 0–51, VP9/AV1: 0–255, VP8: 0–127).">--</span>
    &nbsp;&nbsp;Freezes/min: <span id="m-frz" title="Stalls &gt;150 ms detected by the browser, scaled to per-minute rate over the rolling 10s window.">--</span>
    &nbsp;&nbsp;JBD (ms): <span id="m-jbd" title="Average jitter buffer delay per frame over the rolling 10s window. The receiver holds each frame this long after arrival to absorb network timing variance. Rising values usually predict freezes a few seconds before they happen.">--</span>
  </div>
  <div id="video-area">
    <p id="status">Connecting to signalling server…</p>
    <video id="stream" autoplay playsinline muted></video>
  </div>

  <!--
    The webpack bundle sets window.GstWebRTCAPI (not an ES-module export),
    so it must be loaded as a classic script before the inline script runs.

    Query parameters:
      ?signalling=ws://host:8443   Override the signalling server URL.
                                   Defaults based on URL path:
                                     /        -> ws://<hostname>:8443  (full stream)
                                     /top     -> ws://<hostname>:8444  (top half)
                                     /bottom  -> ws://<hostname>:8445  (bottom half)
      ?stun=stun.l.google.com:19302  Add a STUN server for ICE when the
                                     browser and container are on different hosts.
  -->
  <!--
    GStreamer's webrtcbin uses ssrc-level MSID (a=ssrc:... msid:...) rather than
    the Unified-Plan m-line-level attribute (a=msid:).  Chrome's Unified-Plan
    RTCPeerConnection therefore fires ontrack with event.streams = [].
    gstwebrtc-api checks event.streams[0] and silently returns when it's absent,
    leaving video.srcObject unset even though the connection is fully established.

    This shim patches RTCPeerConnection BEFORE gstwebrtc-api loads so that every
    consumer peer connection also has a track listener that creates a MediaStream
    directly from event.track when event.streams is empty.
  -->
  <script>
    (function () {
      var _OrigRPC = window.RTCPeerConnection;
      function PatchedRPC(cfg) {
        var pc = new _OrigRPC(cfg);
        window._streamPc = pc;
        pc.addEventListener('track', function (e) {
          var vid = document.getElementById('stream');
          if (!vid || vid.srcObject) return;
          vid.srcObject = (e.streams && e.streams.length > 0)
            ? e.streams[0]
            : new MediaStream([e.track]);
          // Chrome's autoplay policy rejects play() without a user gesture
          // unless the element is muted.  The stream has no audio track so
          // muting is harmless; belt-and-suspenders in case the attribute
          // was stripped or overridden.
          vid.muted = true;
          var p = vid.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function (err) {
              console.warn('[stream] video.play() rejected:', err);
            });
          }
        });
        return pc;
      }
      PatchedRPC.prototype = _OrigRPC.prototype;
      window.RTCPeerConnection = PatchedRPC;
    })();
  </script>
  <script src="./gstwebrtc-api/gstwebrtc-api.js"></script>
  <script>
    const params   = new URLSearchParams(window.location.search);
    const path     = window.location.pathname.replace(/\/$/, '');
    const sigPort  = path === '/top' ? 8444 : path === '/bottom' ? 8445 : 8443;
    const sigUrl   = params.get('signalling') ??
                     `ws://${window.location.hostname}:${sigPort}`;
    const stunUrl  = params.get('stun');
    const turnUri  = params.get('turn_uri');
    const turnUser = params.get('turn_user');
    const turnCred = params.get('turn_cred');

    const video  = document.getElementById('stream');
    const status = document.getElementById('status');

    document.getElementById('m-name').textContent =
      sigUrl.replace(/^wss?:\/\//, '').split(':')[0];

    const setStatus = (msg, isError = false) => {
      status.textContent = msg;
      status.className   = isError ? 'error' : '';
    };

    let _metricsTimer = null;
    const _snapshots = [];     // rolling window of inbound-rtp counters
    const WINDOW_LEN = 10;     // 1Hz × 10 = ~10s rolling window

    // Codec-dependent QP ranges; used to set the "yellow" threshold for the health dot.
    // Source: codec specs. H.264: 0–51, VP8: 0–127, VP9/AV1: 0–255.
    const QP_MAX = { 'video/H264': 51, 'video/VP8': 127, 'video/VP9': 255, 'video/AV1': 255 };
    const QP_YELLOW_RATIO = 0.7;

    async function updateMetrics() {
      const pc = window._streamPc;
      if (!pc || typeof pc.getStats !== 'function') return;
      let stats;
      try { stats = await pc.getStats(); } catch (_) { return; }

      const codecsById = new Map();
      stats.forEach(r => { if (r.type === 'codec') codecsById.set(r.id, r.mimeType); });

      const snap = { t: performance.now() };
      let curFps = null;
      let rttSec = null;

      stats.forEach(r => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') {
          curFps              = (typeof r.framesPerSecond === 'number') ? r.framesPerSecond : null;
          snap.framesDecoded  = r.framesDecoded     ?? 0;
          snap.qpSum          = (typeof r.qpSum === 'number') ? r.qpSum : null;
          snap.freezeCount    = r.freezeCount       ?? 0;
          snap.packetsLost    = r.packetsLost       ?? 0;
          snap.packetsReceived= r.packetsReceived   ?? 0;
          snap.pliCount       = r.pliCount          ?? 0;
          snap.jbDelay        = (typeof r.jitterBufferDelay         === 'number') ? r.jitterBufferDelay         : null;
          snap.jbEmitted      = (typeof r.jitterBufferEmittedCount  === 'number') ? r.jitterBufferEmittedCount  : null;
          snap.frameWidth     = r.frameWidth        ?? 0;
          snap.frameHeight    = r.frameHeight       ?? 0;
          snap.mimeType       = codecsById.get(r.codecId) || null;
        }
        // Per-stream RTT (preferred): from RTCP RR/SR exchange for this video track.
        if (r.type === 'remote-inbound-rtp' && r.kind === 'video') {
          if (typeof r.roundTripTime === 'number') rttSec = r.roundTripTime;
        }
      });

      // Fallback: ICE candidate-pair RTT (network-wide, not video-specific).
      // Used until the first RTCP report exchange completes.
      if (rttSec == null) {
        stats.forEach(r => {
          if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') {
            if (typeof r.currentRoundTripTime === 'number') rttSec = r.currentRoundTripTime;
          }
        });
      }

      _snapshots.push(snap);
      while (_snapshots.length > WINDOW_LEN + 1) _snapshots.shift();

      const old    = _snapshots[0];
      const winSec = (snap.t - old.t) / 1000;

      // FPS: prefer Chrome's instantaneous value; fallback to window-averaged delta.
      let fps = curFps;
      if (fps == null && winSec > 0 && snap.framesDecoded != null && old.framesDecoded != null) {
        fps = (snap.framesDecoded - old.framesDecoded) / winSec;
      }

      // Average QP per frame over the window.
      const dFrames = (snap.framesDecoded ?? 0) - (old.framesDecoded ?? 0);
      const avgQp   = (snap.qpSum != null && old.qpSum != null && dFrames > 0)
          ? (snap.qpSum - old.qpSum) / dFrames
          : null;

      // Loss percentage over the window.
      const dLost   = snap.packetsLost      - old.packetsLost;
      const dRecv   = snap.packetsReceived  - old.packetsReceived;
      const lossPct = (dRecv + dLost) > 0 ? (dLost / (dRecv + dLost)) * 100 : null;

      // Freezes per minute, rescaled from the window length.
      const dFreezes      = snap.freezeCount - old.freezeCount;
      const freezesPerMin = winSec > 0 ? (dFreezes / winSec) * 60 : null;

      // Keyframe requests over the window — even one means severe loss.
      const dPli = snap.pliCount - old.pliCount;

      // Average jitter buffer delay per frame over the window, in ms.
      // Rising = network getting bursty; usually predicts freezes.
      const avgJbMs = (snap.jbDelay != null && old.jbDelay != null
                       && snap.jbEmitted != null && old.jbEmitted != null
                       && (snap.jbEmitted - old.jbEmitted) > 0)
          ? ((snap.jbDelay - old.jbDelay) / (snap.jbEmitted - old.jbEmitted)) * 1000
          : null;

      const res = (snap.frameWidth && snap.frameHeight)
          ? `${snap.frameWidth}×${snap.frameHeight}`
          : null;

      // Health classifier — needs a few samples before it's meaningful.
      let health = null;
      if (_snapshots.length >= 3) {
        const qpYellow = (QP_MAX[snap.mimeType] ?? 51) * QP_YELLOW_RATIO;
        if ((freezesPerMin != null && freezesPerMin > 2)
            || dPli > 0
            || (lossPct != null && lossPct > 5)) {
          health = 'red';
        } else if ((avgQp != null && avgQp > qpYellow)
            || (lossPct != null && lossPct > 1)
            || (avgJbMs != null && avgJbMs > 200)) {
          health = 'yellow';
        } else if (fps != null && fps > 0) {
          health = 'green';
        }
      }

      document.getElementById('m-fps').textContent = fps    != null ? fps.toFixed(1) : '--';
      // RTT/2 in ms = rttSec * 1000 / 2 = rttSec * 500
      document.getElementById('m-lat').textContent = rttSec != null ? Math.round(rttSec * 500).toString() : '--';
      document.getElementById('m-res').textContent = res    ?? '--';
      document.getElementById('m-qp' ).textContent = avgQp  != null ? Math.round(avgQp).toString() : '--';
      document.getElementById('m-frz').textContent = freezesPerMin != null ? freezesPerMin.toFixed(1) : '--';
      document.getElementById('m-jbd').textContent = avgJbMs != null ? Math.round(avgJbMs).toString() : '--';
      const dot = document.getElementById('m-health');
      dot.classList.remove('green', 'yellow', 'red');
      if (health) dot.classList.add(health);
    }

    function startMetrics() {
      stopMetrics();
      _metricsTimer = setInterval(updateMetrics, 1000);
      updateMetrics();
    }

    function stopMetrics() {
      if (_metricsTimer != null) {
        clearInterval(_metricsTimer);
        _metricsTimer = null;
      }
      _snapshots.length = 0;
      for (const id of ['m-fps', 'm-lat', 'm-res', 'm-qp', 'm-frz', 'm-jbd']) {
        document.getElementById(id).textContent = '--';
      }
      document.getElementById('m-health').classList.remove('green', 'yellow', 'red');
    }

    setStatus(`Connecting to ${sigUrl} …`);

    const iceServers = [];
    if (stunUrl) iceServers.push({ urls: `stun:${stunUrl}` });
    if (turnUri) iceServers.push({ urls: turnUri, username: turnUser ?? undefined, credential: turnCred ?? undefined });

    const api = new GstWebRTCAPI({
      signalingServerUrl: sigUrl,
      // webrtcConfig is passed directly to RTCPeerConnection() by gstwebrtc-api.
      webrtcConfig: { iceServers },
    });

    api.registerProducersListener({
      producerAdded(producer) {
        setStatus(`Producer found (${producer.id}) — starting stream…`);

        const session = api.createConsumerSession(producer.id);
        if (!session) {
          setStatus('Failed to create consumer session.', true);
          return;
        }

        session.element = video;

        session.addEventListener('error', (e) => {
          setStatus(`Stream error: ${e.message ?? e}`, true);
        });

        session.addEventListener('closed', () => {
          setStatus('Stream ended.');
          video.srcObject = null;
          stopMetrics();
        });

        const hideBanner = () => { status.className = 'hidden'; };
        if (!video.paused && video.videoWidth > 0) {
          hideBanner();
          startMetrics();
        } else {
          video.addEventListener('playing', hideBanner, { once: true });
          video.addEventListener('loadeddata', hideBanner, { once: true });
          video.addEventListener('playing', startMetrics, { once: true });
        }

        session.connect();
      },

      producerRemoved(_producer) {
        setStatus('Producer disconnected. Waiting for stream…');
        video.srcObject = null;
        stopMetrics();
      },
    });
  </script>
</body>
</html>
