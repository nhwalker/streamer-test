<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Stream</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #status {
      padding: 0.75em 1.25em;
      background: rgba(255,255,255,0.07);
      border-radius: 6px;
      margin-bottom: 1em;
      max-width: 480px;
      text-align: center;
      line-height: 1.5;
    }

    #status.error { color: #f88; background: rgba(255,80,80,0.12); }
    #status.hidden { display: none; }

    video {
      max-width: 100vw;
      max-height: 100vh;
      display: block;
      background: #000;
    }
  </style>

  <!--
    gstwebrtc-api 0.12.x reads window.gstWebRTCConfig on load (not a constructor).
    Compute signalling URL and ICE servers from query params here, before the
    script tag, so the singleton picks them up at initialisation time.

    Query parameters:
      ?signalling=ws://host:8443   Override the signalling server URL.
                                   Defaults based on URL path:
                                     /        -> ws://<hostname>:8443  (full stream)
                                     /top     -> ws://<hostname>:8444  (top half)
                                     /bottom  -> ws://<hostname>:8445  (bottom half)
      ?stun=stun.l.google.com:19302  Add a STUN server.
      ?turn_uri / ?turn_user / ?turn_cred  Add a TURN server.
  -->
  <script>
    (function () {
      var params   = new URLSearchParams(window.location.search);
      var path     = window.location.pathname.replace(/\/$/, '');
      var sigPort  = path === '/top' ? 8444 : path === '/bottom' ? 8445 : 8443;
      var sigUrl   = params.get('signalling') ||
                     ('ws://' + window.location.hostname + ':' + sigPort);
      var stunUrl  = params.get('stun');
      var turnUri  = params.get('turn_uri');
      var turnUser = params.get('turn_user');
      var turnCred = params.get('turn_cred');

      var iceServers = [];
      if (stunUrl) iceServers.push({ urls: 'stun:' + stunUrl });
      if (turnUri) iceServers.push({
        urls: turnUri,
        username: turnUser || undefined,
        credential: turnCred || undefined,
      });

      window.gstWebRTCConfig = {
        signalingServerUrl: sigUrl,
        webrtcConfig: iceServers.length > 0 ? { iceServers: iceServers } : undefined,
      };
    })();
  </script>

  <!--
    GStreamer's webrtcbin uses ssrc-level MSID (a=ssrc:... msid:...) rather than
    the Unified-Plan m-line-level attribute (a=msid:).  Chrome's Unified-Plan
    RTCPeerConnection therefore fires ontrack with event.streams = [].
    gstwebrtc-api checks event.streams[0] and silently returns when it's absent,
    leaving video.srcObject unset even though the connection is fully established.

    This shim patches RTCPeerConnection BEFORE gstwebrtc-api loads so that every
    consumer peer connection also has a track listener that creates a MediaStream
    directly from event.track when event.streams is empty.
  -->
  <script>
    (function () {
      var _OrigRPC = window.RTCPeerConnection;
      function PatchedRPC(cfg) {
        var pc = new _OrigRPC(cfg);
        pc.addEventListener('track', function (e) {
          var vid = document.getElementById('stream');
          if (!vid || vid.srcObject) return;
          vid.srcObject = (e.streams && e.streams.length > 0)
            ? e.streams[0]
            : new MediaStream([e.track]);
          // Chrome's autoplay policy rejects play() without a user gesture
          // unless the element is muted.
          vid.muted = true;
          var p = vid.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function (err) {
              console.warn('[stream] video.play() rejected:', err);
            });
          }
        });
        return pc;
      }
      PatchedRPC.prototype = _OrigRPC.prototype;
      window.RTCPeerConnection = PatchedRPC;
    })();
  </script>

  <script src="./gstwebrtc-api/gstwebrtc-api.js"></script>
</head>
<body>
  <p id="status">Connecting to signalling server…</p>
  <video id="stream" autoplay playsinline muted></video>

  <script>
    var video  = document.getElementById('stream');
    var status = document.getElementById('status');
    var sigUrl = window.gstWebRTCConfig.signalingServerUrl;

    var setStatus = function (msg, isError) {
      status.textContent = msg;
      status.className   = isError ? 'error' : '';
    };

    setStatus('Connecting to ' + sigUrl + ' …');

    // gstwebrtc-api 0.12.x exposes a singleton, not a constructor.
    var api = window.gstWebRTCAPI;

    api.registerProducersListener({
      producerAdded: function (producer) {
        setStatus('Producer found (' + producer.id + ') — starting stream…');

        var session = api.createConsumerSession(producer.id);
        if (!session) {
          setStatus('Failed to create consumer session.', true);
          return;
        }

        session.addEventListener('error', function (e) {
          setStatus('Stream error: ' + (e.message || e), true);
        });

        session.addEventListener('stateChanged', function () {
          var s = session.state;
          if (s === 'stopped' || s === 'closed' || s === null) {
            setStatus('Stream ended.');
            video.srcObject = null;
          }
        });

        var hideBanner = function () { status.className = 'hidden'; };
        if (!video.paused && video.videoWidth > 0) {
          hideBanner();
        } else {
          video.addEventListener('playing',    hideBanner, { once: true });
          video.addEventListener('loadeddata', hideBanner, { once: true });
        }

        session.connect();
      },

      producerRemoved: function (_producer) {
        setStatus('Producer disconnected. Waiting for stream…');
        video.srcObject = null;
      },
    });
  </script>
</body>
</html>
