<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Stream</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="header">
    <span id="m-health" title="Overall stream quality. Bright green = lossless (no information thrown away by the encoder). Green = visually lossless (a viewer cannot tell it apart from the source). Dark green = no faults, but quality is not at the top tier. Yellow = degraded: heavy compression or some packet loss. Red = broken: stalls, heavy loss, or keyframe requests. The colours next to each value show that metric's contribution to the overall verdict."></span>
    <span id="m-name">--</span><span id="m-screen"></span>
    <span class="metric" title="Frames per second: how many video frames your browser is decoding each second. Should match the stream's target framerate (typically 30). Lower numbers mean the encoder or network is dropping frames and motion will look choppy. 0 means no video is being received."
      >&nbsp;&nbsp;FPS: <span id="m-fps">--</span></span><span class="metric" title="Latency (RTT/2): roughly how long it takes a packet to travel from the streaming service to your browser, in milliseconds. Network only — encoding, jitter buffering, decoding, and screen refresh are NOT included. Under 20 ms is LAN-quality. Under 50 ms feels instant. 50–150 ms is acceptable but noticeable for interactive use. Above 150 ms feels sluggish."
      >&nbsp;&nbsp;RTT/2 (ms): <span id="m-lat">--</span></span><span class="metric" title="Resolution: the width × height of the frames your browser is currently receiving. When the network is constrained the encoder can shrink the picture (downscale) to keep playback smooth. Matching the source resolution = full picture. Smaller than source = the encoder is sending a smaller image so it fits in the available bandwidth."
      >&nbsp;&nbsp;Res: <span id="m-res">--</span></span><span class="metric" title="QP (quantization parameter): how aggressively the encoder is compressing each frame. Lower is better — every increment of 6 in H.264 roughly doubles the compression. 0 = mathematically lossless. Under ~18 (H.264) is visually indistinguishable from the source. Above ~35 is visibly blocky or smeared. The exact scale depends on the codec (H.264: 0–51, VP8: 0–127, VP9/AV1: 0–255). Averaged over the last 10 seconds."
      >&nbsp;&nbsp;QP: <span id="m-qp">--</span></span><span class="metric" title="Freezes per minute: the number of stalls longer than 150 ms your browser detected, scaled to a per-minute rate over the last 10 seconds. 0 is what you want. Anything &gt; 0 means the picture briefly stopped moving. More than 2 per minute is jarring and usually means the network can't keep up."
      >&nbsp;&nbsp;Freezes/min: <span id="m-frz">--</span></span><span class="metric" title="JBD (jitter buffer delay): how long, on average, your browser holds each frame after it arrives before showing it. The browser deliberately delays frames to absorb network timing variation; without this buffer, packets arriving slightly out of order would cause stutter. Under 100 ms is excellent. 100–200 ms is fine. Rising JBD typically predicts freezes a few seconds before they occur."
      >&nbsp;&nbsp;JBD (ms): <span id="m-jbd">--</span></span><span class="metric" title="Codec: the video compression format negotiated with the producer (e.g. H264, VP8, VP9, AV1). The codec controls how the picture is encoded on the source side and decoded here, and it determines the QP scale shown above."
      >&nbsp;&nbsp;Codec: <span id="m-codec">--</span></span><span class="metric" title="Hardware decode: whether your browser is using a GPU/ASIC video decoder rather than the CPU. ✓ HW = hardware-accelerated (cheaper on the CPU and battery, and usually faster). ✗ SW = software decoding on the CPU. The browser reports both an implementation name (e.g. ExternalDecoder, libvpx, FFmpeg) and a powerEfficientDecoder hint — both are surfaced here. ? = the browser has not yet reported a decoder."
      >&nbsp;&nbsp;HW decode: <span id="m-hw">--</span></span>
  </div>
  <div id="video-area">
    <p id="status">Connecting…</p>
    <video id="stream" autoplay playsinline muted></video>
  </div>

  <!-- WHEP client + tier auto-switch + metrics; see app.js for the
       query-parameter reference (?whep, ?tier, ?stun, ?turn_*). -->
  <script src="/app.js"></script>
</body>
</html>
